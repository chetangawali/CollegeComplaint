<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - College Complaint System</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>

        <div class="logo">
            College Complaint System
        </div>

        <div class="nav-links">

            <a href="{{ url_for('index') }}">
                Home
            </a>

            <a href="{{ url_for('login') }}">
                Student Login
            </a>

        </div>

    </nav>


    <div class="form-container">

        <h1>Admin Login</h1>

        <p>
            Login to manage student complaints
        </p>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter admin username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter admin password"
                required
            >


            <button type="submit">
                Admin Login
            </button>

        </form>


        <p class="bottom-text">

            <a href="{{ url_for('index') }}">
                ← Back to Home
            </a>

        </p>

    </div>

</body>
</html>
